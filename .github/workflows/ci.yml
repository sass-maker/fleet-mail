name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify Fleet Mail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:clean
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:owner-access
      - run: pnpm run build
      - run: pnpm exec wrangler deploy --dry-run
